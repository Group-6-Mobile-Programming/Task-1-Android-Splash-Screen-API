plugins {
    id 'com.android.application'
    id 'checkstyle'
}

android {
    namespace 'com.uneb.eresults'
    compileSdk 35

    defaultConfig {
        applicationId "com.uneb.eresults"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configDirectory = rootProject.file('config/checkstyle')
    ignoreFailures = false          // any error-severity violation fails the build
    maxErrors = 0
    maxWarnings = Integer.MAX_VALUE // warnings are reported but don't block
}

// Android modules have no Java sourceSets, so Checkstyle needs a task we define ourselves
tasks.register('checkstyleAll', Checkstyle) {
    group = 'verification'
    description = 'Runs Checkstyle on all Java sources'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    source = fileTree(dir: 'src', include: '**/*.java')
    classpath = files()
    reports {
        xml.required = true
        html.required = true
    }
}

// `./gradlew check` also runs Checkstyle
tasks.named('check') {
    dependsOn 'checkstyleAll'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}