plugins {
    id 'com.android.application'
    id 'checkstyle'
}

checkstyle {
    toolVersion '10.12.5'
    configFile file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false // Ensures builds fail if style rules are violated
}

tasks.register('checkstyle', Checkstyle) {
    source 'src/main/java'
    include '**/*.java'
    exclude '**/gen/**'
    classpath = files()
}